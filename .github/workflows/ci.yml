name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus_ci
          POSTGRES_PASSWORD: nexus_ci_ephemeral
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://nexus_ci:nexus_ci_ephemeral@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:api
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: postman/reports/
          if-no-files-found: ignore
