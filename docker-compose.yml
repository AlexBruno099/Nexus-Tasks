services:
  db:
    image: postgres:17-alpine
    container_name: bobina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bobina
      POSTGRES_PASSWORD: bobina
      POSTGRES_DB: bobina
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - bobina-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bobina -d bobina']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  bobina-data:
