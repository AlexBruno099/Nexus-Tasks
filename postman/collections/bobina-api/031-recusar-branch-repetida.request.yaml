$kind: http-request
name: "Recusar branch repetida"
order: 31000
method: POST
url: '{{baseUrl}}/branches'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "repo": "postman",
      "name": "test/{{runId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 409', () => pm.expect(pm.response.code).to.be.oneOf([409]));
      
