$kind: collection
name: "nexus-tasks — API completa"
description: "Execute a coleção inteira na ordem. Cria e remove apenas os próprios registros. Use o ambiente Sandbox (npm run api:sandbox) ou Mock. Todas as 15 operações da API são exercitadas. Sem autenticação no uso local."
variables:
  - key: baseUrl
    value: 'http://127.0.0.1:3334/api'
auth:
  type: noauth
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code !== 204) { pm.test('Resposta JSON',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json')); }
      if (pm.response.code >= 400) pm.test('Erro possui mensagem',()=>pm.expect(pm.response.json().error).to.be.a('string').and.not.empty);
