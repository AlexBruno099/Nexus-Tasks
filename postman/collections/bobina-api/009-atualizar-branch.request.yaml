$kind: http-request
name: "Atualizar branch"
order: 9000
method: PATCH
url: '{{baseUrl}}/branches/{{branchId}}'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "color": "#22C55E",
      "notes": "Criada pelo Postman",
      "merged": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("Anotação persistida", () => pm.expect(pm.response.json().notes).to.eql('Criada pelo Postman'));
      
