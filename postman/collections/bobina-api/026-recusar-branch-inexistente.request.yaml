$kind: http-request
name: "Recusar branch inexistente"
order: 26000
method: POST
url: '{{baseUrl}}/tasks'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "title": "Branch inválida",
      "columnId": "{{todoId}}",
      "branchId": 2147483647
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 400', () => pm.expect(pm.response.code).to.be.oneOf([400]));
      
