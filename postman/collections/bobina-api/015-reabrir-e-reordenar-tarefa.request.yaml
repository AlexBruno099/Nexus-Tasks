$kind: http-request
name: "Reabrir e reordenar tarefa"
order: 15000
method: POST
url: '{{baseUrl}}/tasks/{{taskId}}/move'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "columnId": "{{todoId}}",
      "index": 0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test("Conclusão removida", () => pm.expect(pm.response.json().completedAt).to.eql(null));
      
