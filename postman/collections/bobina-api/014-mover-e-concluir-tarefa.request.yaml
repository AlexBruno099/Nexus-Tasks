$kind: http-request
name: "Mover e concluir tarefa"
order: 14000
method: POST
url: '{{baseUrl}}/tasks/{{taskId}}/move'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "columnId": "{{doneId}}",
      "index": 0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      pm.test('Contrato da tarefa', () => pm.response.to.have.jsonSchema({"type":"object","required":["id","title","description","columnId","position","priority","dueDate","checklist","archived","createdAt","updatedAt","completedAt","labelIds","branchId"],"additionalProperties":false,"properties":{"id":{"type":"integer","minimum":1},"title":{"type":"string","minLength":1,"maxLength":200},"description":{"type":"string"},"columnId":{"type":"integer"},"position":{"type":"integer"},"priority":{"enum":["baixa","media","alta","urgente"]},"dueDate":{"type":["string","null"]},"checklist":{"type":"array","items":{"type":"object","required":["id","text","done"],"properties":{"id":{"type":"string"},"text":{"type":"string"},"done":{"type":"boolean"}}}},"archived":{"type":"boolean"},"createdAt":{"type":"string","format":"date-time"},"updatedAt":{"type":"string","format":"date-time"},"completedAt":{"type":["string","null"],"format":"date-time"},"labelIds":{"type":"array","items":{"type":"integer"},"uniqueItems":true},"branchId":{"type":["integer","null"]}}}));
      pm.test('Data de conclusão preenchida',()=>pm.expect(pm.response.json().completedAt).to.be.a('string'));
