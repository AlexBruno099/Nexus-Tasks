$kind: http-request
name: "Recusar etiqueta inexistente"
order: 25000
method: POST
url: '{{baseUrl}}/tasks'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "title": "Rollback {{runId}}",
      "columnId": "{{todoId}}",
      "labelIds": [
        2147483647
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 400', () => pm.expect(pm.response.code).to.be.oneOf([400]));
      
