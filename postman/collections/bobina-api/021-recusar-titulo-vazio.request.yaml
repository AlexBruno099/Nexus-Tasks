$kind: http-request
name: "Recusar título vazio"
order: 21000
method: POST
url: '{{baseUrl}}/tasks'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "title": " ",
      "columnId": "{{todoId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 400', () => pm.expect(pm.response.code).to.be.oneOf([400]));
      
examples: './.resources/021-recusar-titulo-vazio.resources/examples/'
