$kind: http-request
name: "Criar tarefa em branch para exclusão"
order: 17000
method: POST
url: '{{baseUrl}}/tasks'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "title": "Protegida {{runId}}",
      "columnId": "{{todoId}}",
      "branchId": "{{branchId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      if (pm.response.code === 201) pm.collectionVariables.set('lockedTaskId', pm.response.json().id);
