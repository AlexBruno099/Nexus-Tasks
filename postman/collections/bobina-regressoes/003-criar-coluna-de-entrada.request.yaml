$kind: http-request
name: "Criar coluna de entrada"
order: 3000
method: POST
url: '{{baseUrl}}/columns'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "name": "Postman {{runId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      if (pm.response.code === 201) pm.collectionVariables.set('todoId', pm.response.json().id);pm.test("Coluna começa aberta", () => pm.expect(pm.response.json().isDone).to.eql(false));
      
