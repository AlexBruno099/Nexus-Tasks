$kind: http-request
name: "Limpeza — destrancar branch"
order: 21000
method: PATCH
url: '{{baseUrl}}/branches/{{branchId}}'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "locked": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 200 ou 404', () => pm.expect(pm.response.code).to.be.oneOf([200,404]));
      
