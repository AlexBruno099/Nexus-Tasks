$kind: collection
name: "nexus-tasks — regressões de segurança e consistência"
description: "Asserções obrigatórias: calendário real, faixa dos IDs, bloqueio de exclusões e sincronização da conclusão. Executar em banco isolado ou mock; ambos devem passar."
variables:
  - key: baseUrl
    value: 'http://127.0.0.1:3334/api'
auth:
  type: noauth
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code !== 204) { pm.test('Resposta JSON',()=>pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json')); }
      if (pm.response.code >= 400) pm.test('Erro possui mensagem',()=>pm.expect(pm.response.json().error).to.be.a('string').and.not.empty);
