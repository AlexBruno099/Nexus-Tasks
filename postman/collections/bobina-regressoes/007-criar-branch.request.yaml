$kind: http-request
name: "Criar branch"
order: 7000
method: POST
url: '{{baseUrl}}/branches'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "repo": "postman",
      "name": "test/{{runId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      if (pm.response.code === 201) pm.collectionVariables.set('branchId', pm.response.json().id);pm.test("Branch começa destrancada", () => pm.expect(pm.response.json().locked).to.eql(false));
      
