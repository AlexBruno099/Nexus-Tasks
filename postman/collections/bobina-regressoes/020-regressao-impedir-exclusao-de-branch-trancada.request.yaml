$kind: http-request
name: "Regressão — impedir exclusão de branch trancada"
order: 20000
method: DELETE
url: '{{baseUrl}}/branches/{{branchId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 409', () => pm.expect(pm.response.code).to.be.oneOf([409]));
      
