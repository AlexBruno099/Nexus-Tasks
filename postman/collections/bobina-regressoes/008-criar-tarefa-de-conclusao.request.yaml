$kind: http-request
name: "Criar tarefa de conclusão"
order: 8000
method: POST
url: '{{baseUrl}}/tasks'
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "title": "Conclusão {{runId}}",
      "columnId": "{{todoId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status HTTP esperado: 201', () => pm.expect(pm.response.code).to.be.oneOf([201]));
      if (pm.response.code === 201) pm.collectionVariables.set('completionTaskId', pm.response.json().id);
